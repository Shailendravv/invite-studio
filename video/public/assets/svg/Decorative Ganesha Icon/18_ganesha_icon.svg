<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <g id="ganesha_icon" fill="none" stroke="#5A1818" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Crown Structure (Mukut) Layer -->
    <path id="mukut_crown" d="M 120,70 L 150,20 L 180,70 L 150,85 Z" fill="#5A1818" fill-opacity="0.2"/>
    <line x1="135" y1="52" x2="165" y2="52" stroke-width="1.5"/>
    <!-- Large Stylized Sweeping Left and Right Ears -->
    <path d="M 120,90 C 70,80 50,140 90,160 C 110,170 120,140 120,110" stroke-width="2"/>
    <path d="M 180,90 C 230,80 250,140 210,160 C 190,170 180,140 180,110" stroke-width="2"/>
    <!-- Face, Sacred Tilak, and Fluid Left-Turning Trunk Wave (Vakratunda) -->
    <path id="face_trunk" d="M 130,90 C 130,90 150,95 170,90 C 165,130 185,160 180,210 C 175,250 135,260 120,230 C 110,210 130,195 145,210 C 155,220 160,200 160,170" stroke-width="3" fill="#5A1818" fill-opacity="0.05"/>
    <!-- Sacred Forehead Trishul Tilak Markings -->
    <g id="tilak_marks" fill="#5A1818" stroke="none">
      <path d="M 144,95 Q 150,120 156,95 Z"/>
      <circle cx="150" cy="123" r="2.5"/>
    </g>
    <!-- Single Tusk (Ekadanta) Accent -->
    <path d="M 132,150 L 122,153 L 131,158 Z" fill="#5A1818" stroke-width="1"/>
  </g>
</svg>
