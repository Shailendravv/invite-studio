<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500" width="100%" height="100%">
  <g id="mandap_pillar" fill="none" stroke="#5A1818" stroke-linejoin="round" stroke-linecap="round">
    <!-- Heavy Tiered Structural Pedestal Foundation Base -->
    <rect x="30" y="450" width="140" height="30" rx="2" stroke-width="3" fill="#5A1818" fill-opacity="0.2"/>
    <rect x="45" y="420" width="110" height="30" rx="1" stroke-width="2"/>
    <path d="M 55,420 L 70,380 L 130,380 L 145,420 Z" stroke-width="1.5" fill="#5A1818" fill-opacity="0.1"/>
    <!-- Main Vertical Fluted Column Shaft -->
    <g id="pillar_shaft">
      <rect x="75" y="120" width="50" height="260" stroke-width="2.5"/>
      <line x1="87" y1="120" x2="87" y2="380" stroke-width="1"/>
      <line x1="100" y1="120" x2="100" y2="380" stroke-width="1.5"/>
      <line x1="113" y1="120" x2="113" y2="380" stroke-width="1"/>
    </g>
    <!-- Intricate Floral Capital Crown Head -->
    <g id="pillar_capital" fill="#5A1818" fill-opacity="0.15">
      <path d="M 60,120 C 60,90 80,80 100,80 C 120,80 140,90 140,120 Z" stroke-width="2"/>
      <circle cx="100" cy="100" r="6" fill="#5A1818" stroke="none"/>
      <line x1="50" y1="75" x2="150" y2="75" stroke-width="3"/>
    </g>
    <!-- Hanging Temple Bell Accent Piece -->
    <g id="hanging_bell" transform="translate(100, 0)">
      <line x1="0" y1="380" x2="0" y2="405" stroke-width="1.5"/>
      <path d="M -10,420 C -10,410 -6,405 0,405 C 6,405 10,410 10,420 Z" stroke-width="1.5" fill="#5A1818"/>
      <circle cx="0" cy="425" r="2.5" fill="#5A1818" stroke="none"/>
    </g>
  </g>
</svg>
