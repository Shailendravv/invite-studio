<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <g id="royal_jhummar" fill="none" stroke="#5A1818" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Hanging Extension Chain Link -->
    <line x1="150" y1="0" x2="150" y2="70" stroke-width="2" stroke-dasharray="8 4"/>
    <circle cx="150" cy="70" r="6" fill="#5A1818"/>
    <!-- Tier 1: Small High-Arch Canopy Ring -->
    <path d="M 120,110 Q 150,85 180,110" stroke-width="2" fill="#5A1818" fill-opacity="0.1"/>
    <!-- Tier 2: Mid-Level Expansive Swag Beaded String Loops -->
    <path d="M 90,170 Q 150,200 210,170" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 60,160 L 240,160" stroke-width="3.5"/>
    <!-- Tier 3: Main Base Rim Bar with Hanging Lamps/Drops -->
    <path d="M 40,240 C 40,240 60,270 150,270 C 240,270 260,240 260,240 Z" stroke-width="2" fill="#5A1818" fill-opacity="0.15"/>
    <!-- Vertical Crystal Drop Strands Pendants Assembly -->
    <g id="crystal_drops" fill="#5A1818" stroke="none">
      <!-- Left Drop -->
      <path d="M 75,255 L 70,285 L 80,285 Z"/> <circle cx="75" cy="293" r="2.5"/>
      <!-- Center Main Deep Cascade Drop -->
      <path d="M 150,270 L 142,320 L 158,320 Z" fill-opacity="0.6"/> 
      <path d="M 150,325 L 145,355 L 155,355 Z"/> <circle cx="150" cy="365" r="4"/>
      <!-- Right Drop -->
      <path d="M 225,255 L 220,285 L 230,285 Z"/> <circle cx="225" cy="293" r="2.5"/>
    </g>
  </g>
</svg>
