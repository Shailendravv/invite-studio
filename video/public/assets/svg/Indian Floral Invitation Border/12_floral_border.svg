<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- One repeating seamless abstract floral-vine modular block cell link -->
    <g id="border_repeating_unit" fill="none" stroke="#5A1818" stroke-width="1.5">
      <!-- S-curve wave stem line -->
      <path d="M 0,60 C 50,15 50,105 100,60 C 150,15 150,105 200,60"/>
      <!-- Floral Node Center Core 1 -->
      <g transform="translate(50, 60)">
        <circle cx="0" cy="0" r="10" fill="#5A1818" fill-opacity="0.2"/>
        <circle cx="0" cy="0" r="4" fill="#5A1818"/>
        <!-- Petal radiating sparks -->
        <path d="M-14,0 L14,0 M0,-14 L0,14" stroke-width="1"/>
      </g>
      <!-- Floral Node Center Core 2 -->
      <g transform="translate(150, 60)">
        <circle cx="0" cy="0" r="10" fill="#5A1818" fill-opacity="0.2"/>
        <circle cx="0" cy="0" r="4" fill="#5A1818"/>
        <path d="M-10,-10 L10,10 M-10,10 L10,-10" stroke-width="1"/>
      </g>
      <!-- Small flanking paisley leaf buds sprouting off stem -->
      <path d="M 25,45 C 20,30 5,30 0,40 C 10,45 20,45 25,45 Z" fill="#5A1818"/>
      <path d="M 75,75 C 80,90 95,90 100,80 C 90,75 80,75 75,75 Z" fill="#5A1818"/>
    </g>
  </defs>
  <!-- Framing Guardrails Lines System -->
  <g id="floral_border_assembly">
    <line x1="0" y1="15" x2="800" y2="15" stroke="#5A1818" stroke-width="3"/>
    <line x1="0" y1="23" x2="800" y2="23" stroke="#5A1818" stroke-width="1" stroke-dasharray="6 3"/>
    <line x1="0" y1="97" x2="800" y2="97" stroke="#5A1818" stroke-width="1" stroke-dasharray="6 3"/>
    <line x1="0" y1="105" x2="800" y2="105" stroke="#5A1818" stroke-width="3"/>
    <!-- Tiled Array Blocks Layout -->
    <use href="#border_repeating_unit" xlink:href="#border_repeating_unit" x="0" y="0"/>
    <use href="#border_repeating_unit" xlink:href="#border_repeating_unit" x="200" y="0"/>
    <use href="#border_repeating_unit" xlink:href="#border_repeating_unit" x="400" y="0"/>
    <use href="#border_repeating_unit" xlink:href="#border_repeating_unit" x="600" y="0"/>
  </g>
</svg>
