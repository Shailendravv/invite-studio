<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="100%" height="100%">
  <g id="haldi_bowl" fill="none" stroke="#5A1818" stroke-linejoin="round" stroke-linecap="round">
    <!-- Low Brass Pedestal Footing -->
    <path d="M 110,210 L 190,210 L 175,190 L 125,190 Z" stroke-width="2" fill="#5A1818" fill-opacity="0.2"/>
    <!-- Deep Wide Metal Urlie / Mixing Container Bowl -->
    <path d="M 40,120 C 40,180 80,190 150,190 C 220,190 260,180 260,120 L 245,110 L 55,110 Z" stroke-width="3" fill="#5A1818" fill-opacity="0.05"/>
    <ellipse cx="150" cy="110" rx="95" ry="12" stroke-width="2" fill="#5A1818" fill-opacity="0.15"/>
    <!-- Smooth Mound of Grinded Turmeric Paste Inside -->
    <path id="haldi_mound" d="M 75,106 C 100,60 200,60 225,106 Z" stroke-width="1.5" fill="#5A1818" fill-opacity="0.3"/>
    <!-- Floating Protective Marigold Petal Accents on Paste -->
    <g id="floating_petals" fill="#5A1818" stroke="none">
      <circle cx="120" cy="95" r="4"/>
      <circle cx="175" cy="85" r="3"/>
      <circle cx="150" cy="100" r="4"/>
    </g>
    <!-- Side Ring Drop Handles -->
    <circle cx="43" cy="135" r="12" stroke-width="1.5"/>
    <circle cx="257" cy="135" r="12" stroke-width="1.5"/>
  </g>
</svg>
