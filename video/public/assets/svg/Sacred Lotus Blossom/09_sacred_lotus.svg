<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="100%" height="100%">
  <g id="sacred_lotus" fill="#5A1818" stroke="#5A1818" stroke-linejoin="round" stroke-linecap="round">
    <!-- Center Core Pointed Double-Sided Master Shield Petal -->
    <path id="center_petal" d="M 150,40 C 135,80 135,140 150,190 C 165,140 165,80 150,40 Z" stroke-width="2" fill-opacity="0.2"/>
    <!-- Symmetric Inner Middle Left & Right Petal Wings Pair -->
    <path d="M 150,60 C 110,90 100,140 120,185 C 135,150 145,110 150,60 Z" stroke-width="1.5" fill-opacity="0.1"/>
    <path d="M 150,60 C 190,90 200,140 180,185 C 165,150 155,110 150,60 Z" stroke-width="1.5" fill-opacity="0.1"/>
    <!-- Outer Flared Wild Low Hanging Horizon Petals Drops -->
    <path d="M 140,85 C 80,110 60,160 85,195 C 110,175 125,140 140,85 Z" stroke-width="1" fill-opacity="0.05"/>
    <path d="M 160,85 C 220,110 240,160 215,195 C 190,175 175,140 160,85 Z" stroke-width="1" fill-opacity="0.05"/>
    <!-- Heavy Solid Horizontal Drooping Support Ground Pods Base -->
    <path d="M 150,170 C 110,190 70,215 90,225 C 120,215 140,195 150,170 Z" stroke-width="1"/>
    <path d="M 150,170 C 190,190 230,215 210,225 C 180,215 160,195 150,170 Z" stroke-width="1"/>
    <!-- Small Spiritual Bead Drop base connection marker -->
    <circle cx="150" cy="205" r="4" stroke="none"/>
  </g>
</svg>
