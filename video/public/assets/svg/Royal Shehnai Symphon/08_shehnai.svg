<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <g id="shehnai_instrument" fill="none" stroke="#5A1818" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main Long Tapering Stem Conical Pipe Barrels (Angled placement) -->
    <path d="M 50,55 L 300,85 L 300,105 L 50,65 Z" stroke-width="2" fill="#5A1818" fill-opacity="0.1"/>
    <!-- Decorative Sound Finger Holes Line (centered on the pipe axis) -->
    <g id="finger_holes" fill="#5A1818" stroke="none">
      <circle cx="90" cy="65.6" r="3.5"/>  <circle cx="120" cy="69.8" r="3.5"/>
      <circle cx="150" cy="74" r="3.5"/> <circle cx="180" cy="78.2" r="3.5"/>
      <circle cx="210" cy="82.4" r="3.5"/> <circle cx="240" cy="86.6" r="3.5"/>
    </g>
    <!-- Exaggerated Flared Out Brass Sound Bell Output Mouth -->
    <path d="M 300,85 C 320,80 340,60 365,60 L 365,130 C 340,130 320,110 300,105 Z" stroke-width="2.5" fill="#5A1818" fill-opacity="0.3"/>
    <ellipse cx="365" cy="95" rx="6" ry="35" stroke-width="2.5"/>
    <!-- Elegant Royal Hanging Decorative Tassels (Gehna String Thread) -->
    <path d="M 150,81 Q 170,120 230,120" stroke-width="1.25" stroke-dasharray="3 3"/>
    <g id="tassel_cluster" fill="#5A1818">
      <path d="M 230,120 L 225,140 L 235,140 Z"/>
      <circle cx="230" cy="146" r="2.5"/>
    </g>
    <!-- Narrow Mouthpiece Reed Section Inlet Entry -->
    <rect x="30" y="57" width="20" height="6" rx="1" fill="#5A1818"/>
    <line x1="30" y1="60" x2="15" y2="60" stroke-width="2"/>
  </g>
</svg>
