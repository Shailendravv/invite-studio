<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 400" width="100%" height="100%">
  <g id="royal_peacock" fill="none" stroke="#5A1818" stroke-linejoin="round" stroke-linecap="round">
    <!-- Gracefully Curved S-Shape Neck & Torso Body Silhouette -->
    <path id="peacock_body" d="M 210,70 C 190,45 160,50 150,70 C 140,90 180,120 170,160 C 160,200 100,210 90,260 C 80,310 120,350 160,350 C 210,350 220,280 200,220 C 190,190 225,100 210,70 Z" stroke-width="3" fill="#5A1818" fill-opacity="0.1"/>
    <!-- Sharp Royal Beak and Head Details Eye Profile -->
    <path id="peacock_beak" d="M 150,70 L 130,75 L 145,83 Z" fill="#5A1818" stroke-width="1"/>
    <circle id="peacock_eye" cx="160" cy="73" r="2.5" fill="#5A1818" stroke="none"/>
    <!-- Three Crown Feathers Crest (Kalgi Top Flaps) -->
    <path d="M 165,60 Q 165,35 170,30 M 170,60 Q 180,38 185,32 M 175,63 Q 195,45 200,40" stroke-width="1"/>
    <g fill="#5A1818" stroke="none">
      <circle cx="170" cy="27" r="2.5"/> <circle cx="185" cy="29" r="2.5"/> <circle cx="200" cy="37" r="2.5"/>
    </g>
    <!-- Wing Feathers Intricate Engraving Frame Layer -->
    <path id="peacock_wing" d="M 165,185 C 135,210 120,255 135,295 C 155,295 185,260 185,210 Z" stroke-width="1.5" fill="#5A1818" fill-opacity="0.2"/>
    <!-- Sweeping Tail Feathers Trains Backdrop Outlines -->
    <g id="feather_train_fans" stroke-width="1" opacity="0.8">
      <path d="M 195,240 C 240,250 280,290 290,340"/>
      <path d="M 185,270 C 230,290 260,330 265,370"/>
      <path d="M 160,310 C 200,340 220,370 220,385"/>
    </g>
    <!-- Eyespots at the tips of the tail feathers -->
    <g id="feather_eyespots">
      <circle cx="290" cy="340" r="7" fill="#5A1818" fill-opacity="0.15" stroke-width="1"/>
      <circle cx="290" cy="340" r="2.5" fill="#5A1818" stroke="none"/>
      <circle cx="265" cy="370" r="7" fill="#5A1818" fill-opacity="0.15" stroke-width="1"/>
      <circle cx="265" cy="370" r="2.5" fill="#5A1818" stroke="none"/>
      <circle cx="220" cy="385" r="7" fill="#5A1818" fill-opacity="0.15" stroke-width="1"/>
      <circle cx="220" cy="385" r="2.5" fill="#5A1818" stroke="none"/>
    </g>
  </g>
</svg>
