<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <g id="swastika_mandala" fill="none" stroke="#5A1818" stroke-linejoin="round" stroke-linecap="round">
    <!-- Geometric Concentric Outer Ring Frame Layout -->
    <circle cx="150" cy="150" r="135" stroke-width="2.5"/>
    <circle cx="150" cy="150" r="120" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="150" cy="150" r="90" stroke-width="1.5"/>
    <!-- Sharp Clean Traditional Indian Vedic Swastika Core -->
    <path id="swastika_core" d="M 100,150 L 200,150 M 150,100 L 150,200 M 100,150 L 100,190 M 200,150 L 200,110 M 150,100 L 190,100 M 150,200 L 110,200" stroke-width="4.5"/>
    <!-- Four Spiritual Inner Dot Matrix Markers (Bindus) -->
    <g id="mandala_bindus" fill="#5A1818" stroke="none">
      <circle cx="125" cy="125" r="4.5"/> <circle cx="175" cy="125" r="4.5"/>
      <circle cx="125" cy="175" r="4.5"/> <circle cx="175" cy="175" r="4.5"/>
    </g>
    <!-- Outer Ring Radiant Small Sunlight Rays/Triangle Spurs -->
    <path d="M 150,5 L 150,15 M 150,285 L 150,295 M 5,150 L 15,150 M 285,150 L 295,150" stroke-width="2"/>
  </g>
</svg>
