<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 410" width="100%" height="100%">
  <g id="hand_fan" fill="none" stroke="#5A1818" stroke-linejoin="round" stroke-linecap="round">
    <!-- Long Turned Wood Structural Grip Handle Rod -->
    <line x1="150" y1="180" x2="150" y2="400" stroke-width="3.5"/>
    <circle cx="150" cy="310" r="7" fill="#5A1818" stroke="none"/>
    <circle cx="150" cy="395" r="9" fill="#5A1818"/>
    <!-- Semi-Circular/Heart Fan Blade Shield Screen -->
    <path id="fan_blade" d="M 150,180 C 80,180 30,140 30,80 C 30,20 100,20 150,65 C 200,20 270,20 270,80 C 270,140 220,180 150,180 Z" stroke-width="3" fill="#5A1818" fill-opacity="0.05"/>
    <!-- Radial Rib Spokes Reinforcements Wireframe -->
    <g id="fan_spokes" stroke-width="1">
      <line x1="150" y1="180" x2="65" y2="40"/>
      <line x1="150" y1="180" x2="105" y2="30"/>
      <line x1="150" y1="180" x2="150" y2="25"/>
      <line x1="150" y1="180" x2="195" y2="30"/>
      <line x1="150" y1="180" x2="235" y2="40"/>
    </g>
    <!-- Border Frill Lace Scallop Detailing -->
    <path d="M 33,75 C 45,70 50,55 60,50" stroke-width="1.5"/>
    <circle cx="150" cy="115" r="12" stroke-width="1.5" fill="#5A1818" fill-opacity="0.2"/>
  </g>
</svg>
