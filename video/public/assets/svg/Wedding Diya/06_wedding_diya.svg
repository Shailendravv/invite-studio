<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="100%" height="100%">
  <g id="wedding_diya" fill="none" stroke="#5A1818" stroke-linejoin="round" stroke-linecap="round">
    <!-- Elevated Base Pedestal Stand -->
    <path d="M 75,220 L 175,220 L 150,190 L 100,190 Z" stroke-width="2" fill="#5A1818" fill-opacity="0.1"/>
    <line x1="125" y1="190" x2="125" y2="150" stroke-width="4"/>
    <!-- Main Oval Diya Oil Brass Clay Vessel Container -->
    <path d="M 40,110 C 40,165 100,165 125,165 C 150,165 210,165 210,110 C 210,110 170,125 125,125 C 80,125 40,110 40,110 Z" stroke-width="2.5" fill="#5A1818" fill-opacity="0.15"/>
    <!-- Ornamental Intricate Swirls under Vessel Body -->
    <path d="M 60,125 Q 125,150 190,125" stroke-width="1"/>
    <!-- Holy Clean Sharp Flame Motif (Jyoti) -->
    <g id="diya_flame" fill="#5A1818">
      <!-- Inner core flame layer -->
      <path d="M 125,115 C 105,115 100,85 125,40 C 150,85 145,115 125,115 Z" fill-opacity="0.4"/>
      <!-- Outer radiant flame layer -->
      <path d="M 125,125 C 95,125 90,80 125,20 C 160,80 155,125 125,125 Z" stroke-width="1.5" fill-opacity="0.1"/>
      <!-- Small spark point at absolute top tip -->
      <circle cx="125" cy="12" r="2.5" stroke="none"/>
    </g>
  </g>
</svg>
